services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safety-graph-orchestrator
    ports:
      - "8000:8000"
    environment:
      - SAFETY_GRAPH_OLLAMA_BASE_URL=http://ollama:11434
      - SAFETY_GRAPH_OLLAMA_MODEL=llama3.2:latest
      - SAFETY_GRAPH_USE_MOCK_LLM_FALLBACK=true
      - SAFETY_GRAPH_LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/.chromadb
      - reports_data:/app/reports
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: safety-graph-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
  reports_data:
    driver: local
  ollama_models:
    driver: local
